<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Blixto</title>
<style>
  :root { --bg:#0b0a24; --purple:#9b7cf0; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); }
  body { display:flex; align-items:center; justify-content:center; overflow:hidden; touch-action:none; }
  #wrap { width:min(100vw, calc((100vh - 90px) * 384 / 208)); min-width:300px; padding:0 8px; }
  #stage { position:relative; border:3px solid #3a3470; border-radius:14px / 10px; overflow:hidden; background:#000;
    box-shadow: 0 0 18px rgba(155,124,240,.25); }
  canvas { display:block; width:100%; height:auto; image-rendering:pixelated; image-rendering:crisp-edges; }
  #touch { display:none; justify-content:space-between; padding:8px 0; gap:8px; }
  #touch div { display:flex; gap:8px; }
  #touch button { width:60px; height:60px; border-radius:50%; border:2px solid var(--purple); background:#17143f;
    color:#f1ecff; font:inherit; font-size:20px; -webkit-user-select:none; user-select:none; touch-action:none; }
  #touch button.down { background:var(--purple); }
  @media (pointer:coarse) { #touch { display:flex; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="c" width="384" height="208"></canvas></div>
  <div id="touch">
    <div><button data-k="left">◀</button><button data-k="right">▶</button></div>
    <div><button data-k="run">»</button><button data-k="jump">▲</button></div>
  </div>
</div>
<script>
(() => {
'use strict';

// Tudo está em coordenadas do mapa original (projeto: blixto/ref/mapa-fase1.jpg).
// O cenário é assets/cenario.jpg: a faixa do mapa (y 92..300) sem os personagens.
const OY = 92, VW = 384, VH = 208, WW = 1600, GROUND = 273, STEP = 22, GRAV = 900, FALL_MAX = 420;
// o jogo desenha aqui (resolução limpa); depois o filtro de TV é aplicado na tela visível
const cv = document.getElementById('c');
const vctx = cv.getContext('2d');
const gcv = document.createElement('canvas'); gcv.width = 384; gcv.height = 208;
const ctx = gcv.getContext('2d');
ctx.imageSmoothingEnabled = false;
// baixa resolução usada pelo filtro (a "fita" de vídeo tem pouca definição)
const LW = 256, LH = 139;
const lo = document.createElement('canvas'); lo.width = LW; lo.height = LH;
const lctx = lo.getContext('2d', { willReadFrequently: true });
let glitchRows = 0, glitchY = 0, glitchShift = 0, glitchT = 0;

// filtro: tubo de TV antigo + VHS + 8 bits
function crt() {
  // 1) reduz para a resolução baixa (perde definição)
  lctx.imageSmoothingEnabled = true;
  lctx.drawImage(gcv, 0, 0, LW, LH);
  const img = lctx.getImageData(0, 0, LW, LH), d = img.data;

  // 2) falhas de VHS: faixas que tremem horizontalmente
  glitchT -= 1;
  if (glitchT <= 0 && Math.random() < 0.02) { glitchRows = 3 + Math.floor(Math.random() * 6); glitchY = Math.floor(Math.random() * LH); glitchShift = (Math.random() < 0.5 ? -1 : 1) * (2 + Math.floor(Math.random() * 5)); glitchT = 20 + Math.floor(Math.random() * 60); }
  const rowShift = new Array(LH).fill(0);
  if (glitchRows > 0) { for (let y = glitchY; y < Math.min(LH, glitchY + glitchRows); y++) rowShift[y] = glitchShift; glitchRows = Math.max(0, glitchRows - 0.25); }
  // pequeno tremor do vídeo em toda a imagem
  const jitter = Math.random() < 0.2 ? 1 : 0;

  const out = new Uint8ClampedArray(d.length);
  for (let y = 0; y < LH; y++) {
    const sh = rowShift[y] + (y % 37 === 5 ? jitter : 0);
    const scan = (y % 2) ? 0.9 : 1;          // linhas de varredura
    for (let x = 0; x < LW; x++) {
      let sx = x - sh; sx = sx < 0 ? 0 : (sx >= LW ? LW - 1 : sx);
      const i = (y * LW + sx) * 4;
      // deslocamento de cor (o canal vermelho e o azul "vazam" para os lados)
      const xl = sx > 0 ? sx - 1 : 0, xr = sx < LW - 1 ? sx + 1 : LW - 1;
      let r = d[(y * LW + xl) * 4], g = d[i + 1], b = d[(y * LW + xr) * 4 + 2];
      // 8 bits: só 6 níveis por canal (cores chapadas)
      const q = v => Math.round(v / 32) * 32;
      r = q(r); g = q(g); b = q(b);
      // chiado de sinal
      const n = Math.random() < 0.1 ? (Math.random() - 0.5) * 36 : 0;
      const o = (y * LW + x) * 4;
      out[o] = (r * scan) + n; out[o + 1] = (g * scan) + n; out[o + 2] = (b * scan) + n; out[o + 3] = 255;
    }
  }
  img.data.set(out);
  lctx.putImageData(img, 0, 0);

  // 3) volta para a tela: ampliado e borrado (imagem mole de tubo)
  vctx.imageSmoothingEnabled = true; vctx.imageSmoothingQuality = 'low';
  vctx.drawImage(lo, 0, 0, 384, 208);

  // 4) linhas de varredura da tela
  vctx.fillStyle = 'rgba(0,0,0,0.1)';
  for (let y = 0; y < 208; y += 2) vctx.fillRect(0, y, 384, 1);
  // 5) barra de sincronismo que sobe pela tela
  const by = ((t * 40) % 260) - 30;
  const bar = vctx.createLinearGradient(0, by - 14, 0, by + 14);
  bar.addColorStop(0, 'rgba(255,255,255,0)'); bar.addColorStop(0.5, 'rgba(255,255,255,0.13)'); bar.addColorStop(1, 'rgba(255,255,255,0)');
  vctx.fillStyle = bar; vctx.fillRect(0, by - 14, 384, 28);
  // 6) cantos escuros (tubo curvo) e leve cintilação
  const vg = vctx.createRadialGradient(192, 104, 80, 192, 104, 230);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.22)');
  vctx.fillStyle = vg; vctx.fillRect(0, 0, 384, 208);
  // 7) chuvisco de estática (neve) em pontos
  for (let k = 0; k < 14; k++) {
    const v = Math.random() < 0.5 ? 255 : 0;
    vctx.fillStyle = `rgba(${v},${v},${v},0.25)`;
    vctx.fillRect(Math.floor(Math.random() * 384), Math.floor(Math.random() * 208), 1, 1);
  }
}

function load(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = ASSETS[src] || src; }); }
function grupo(nome, n) { const a = []; for (let i = 1; i <= n; i++) a.push(IMG[nome + '_' + i]); return a; }
let G = {};                                  // grupos de quadros
let SB = 1, SF = 1;                          // escala Blixto / escafandro (tamanho do mapa)

async function loadAll() {
  const d = DADOS_JSON;
  Object.assign(DADOS, d);
  const specs = {
    blixto_parado: 2, blixto_andar: 6, blixto_correr: 6, blixto_pular: 5, blixto_agachar: 2,
    blixto_virar: 2, blixto_item: 5, blixto_danca: 8,
    escafandro_andar: 6, escafandro_impacto: 4, escafandro_amassado: 3,
  };
  const names = Object.keys(specs);
  const imgs = await Promise.all(names.map(n => Promise.all(
    Array.from({ length: specs[n] }, (_, i) => load('assets/' + n + '_' + (i + 1) + '.png')))));
  names.forEach((n, k) => imgs[k].forEach((im, i) => { IMG[n + '_' + (i + 1)] = im; }));
  G = { ...Object.fromEntries(names.map(n => [n, grupo(n, specs[n])])) };
  G.cenario = await load('assets/cenario.jpg');
  // alturas no mapa: Blixto ~60 px, escafandro ~38 px
  const gd = d.grupos;
  SB = 60 / gd.blixto_andar.h;
  SF = 38 / gd.escafandro_andar.h;
}

// ---------------------------------------------------------------- superfícies
// tolerância de 1,5 px nas bordas: degraus encostados não "somem" entre si
function cover(x) { return SURF.filter(s => x >= s[0] - 1.5 && x <= s[1] + 1.5); }
// topo mais alto que fica no nível dos pés ou abaixo deles (para cair ou pousar)
function landBelow(x, feet) {
  let best = null;
  for (const s of cover(x)) if (s[2] >= feet - 0.5 && (best === null || s[2] < best)) best = s[2];
  return best;
}
// topo mais alto ao alcance de um passo (sobe um bloco)
function stepUp(x, feet) {
  let best = null;
  for (const s of cover(x)) if (s[2] < feet - 0.5 && s[2] >= feet - STEP && (best === null || s[2] < best)) best = s[2];
  return best;
}
// há um topo alto demais para subir (parede)
function wall(x, feet) { return cover(x).some(s => s[2] < feet - STEP); }

// ---------------------------------------------------------------- estado
let areaState, t, camX, fade, lastSafe;
let B, foes, anim, cutX;             // cutX: recorte para a sensação de sair da corneta

function resetBlixto(x, feet) {
  B = { x, feet, vx: 0, vy: 0, on: true, face: 1, jb: 0, coy: 0, jumped: false, inv: 0,
        turnT: 0, landT: 0, air: 0, animT: 0, stepOff: 0, crouch: false, run: false };
}
function spawnFoes() {
  foes = [
    { x: 238, feet: 273, vx: -14, on: true, state: 'andar', t: 0, dead: false, tt: 0 },
    { x: 470, feet: 273, vx: 14, on: true, state: 'andar', t: 0.37, dead: false, tt: 0 },
    { x: 587, feet: 208, vx: -14, on: true, state: 'andar', t: 0.74, dead: false, tt: 0 },
  ];
}

function startLevel() {
  t = 0; areaState = 'sair'; spawnFoes();
  resetBlixto(124, 273);
  B.on = true; cutX = 152;             // sai da boca da corneta
  camX = 0; anim = 0; lastSafe = { x: 124, feet: 273 };
  sfx.horn();
}
function restart() {
  areaState = 'wait';
  fade = { t: 0, dir: 1, fn: () => startLevel() };
}

// ---------------------------------------------------------------- som
let ac = null, muted = false;
function beep(f0, f1, dur, type = 'square', vol = 0.06) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), tt = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f0, tt);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), tt + dur);
    g.gain.setValueAtTime(vol, tt); g.gain.exponentialRampToValueAtTime(0.0001, tt + dur);
    o.connect(g); g.connect(ac.destination); o.start(tt); o.stop(tt + dur);
  } catch (e) { /* sem áudio */ }
}
const sfx = {
  jump: () => beep(300, 620, 0.14),
  stomp: () => beep(220, 70, 0.16, 'triangle', 0.12),
  horn: () => beep(160, 330, 0.35, 'sawtooth', 0.05),
  beam: () => beep(300, 1800, 0.7, 'sine', 0.1),
  item: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, f, 0.14, 'square', 0.07), i * 110)),
  win: () => [523, 659, 784, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, f, 0.18, 'square', 0.07), i * 130)),
};

// ---------------------------------------------------------------- lógica
// morte: volta ao último ponto firme (não ao começo da fase)
function hurt(why = '?') {
  if (areaState !== 'play') return;
  window.__lastHurt = { why, x: B.x, feet: B.feet, vy: B.vy, foes: foes.map(f => [f.x, f.feet, f.state]) };
  areaState = 'wait';
  sfx.stomp();
  fade = { t: 0, dir: 1, fn: () => respawn() };
}
function respawn() {
  const p = lastSafe || { x: 124, feet: 273 };
  areaState = 'play';
  resetBlixto(p.x, p.feet);
  B.inv = 1.5; B.on = true;
  spawnFoes();
  camX = Math.max(0, Math.min(WW - VW, p.x - VW / 2));
}
let saveT = 0;
function saveCheckpoint() {
  // guarda o ponto quando está parado no chão e longe dos escafandros
  const nearFoe = foes.some(f => Math.abs(f.x - B.x) < 60 && f.state === 'andar');
  // só salva onde há chão de sobra dos dois lados (nada de ponto na borda do buraco)
  const solid = x => landBelow(x, B.feet) !== null || stepUp(x, B.feet) !== null;
  const roomy = solid(B.x - 36) && solid(B.x + 36);
  if (B.on && roomy && !nearFoe && t - saveT > 0.6 && areaState === 'play') {
    lastSafe = { x: B.x, feet: B.feet }; saveT = t;
  }
}

function moveBlixtoX(dx) {
  const dir = Math.sign(dx);
  if (dir === 0) return;
  const lead = B.x + dir * 6 + dx;
  if (wall(lead, B.feet)) { B.vx = 0; return; }
  B.x += dx;
  if (!B.on) return;
  const up = stepUp(B.x, B.feet);
  if (up !== null) { B.stepOff = B.feet - up; B.feet = up; return; }
  const down = landBelow(B.x, B.feet);
  if (down !== null && down - B.feet <= STEP) { B.feet = down; return; }
  if (down === null || down - B.feet > STEP) B.on = false;
}

function camera(dt) {
  const want = B.x - VW / 2 + B.face * 24;
  camX += (want - camX) * Math.min(1, dt * 5);
  camX = Math.max(0, Math.min(WW - VW, camX));
}

function update(dt) {
  t += dt;
  if (fade) {
    fade.t += dt * fade.dir / 0.3;
    if (fade.dir > 0 && fade.t >= 1) { fade.t = 1; fade.dir = -1; fade.fn(); }
    else if (fade.dir < 0 && fade.t <= 0) fade = null;
    return;
  }
  B.stepOff = Math.max(0, B.stepOff - 80 * dt);
  B.animT += dt;

  if (areaState === 'sair') {                               // sai da boca da corneta
    B.face = 1; B.vx = 60; moveBlixtoX(B.vx * dt);
    if (B.x >= 160) { areaState = 'play'; B.inv = 0.2; }
    updateFoes(dt); camera(dt); return;
  }
  if (areaState === 'raio') {                              // sobe pelo raio amarelo
    B.feet -= 55 * dt; B.animT += dt;
    B.raioT += dt;
    if (B.raioT > 1.5) { areaState = 'saida'; B.raioT = 0; cutX = HORN2_MOUTH + 2; B.x = 1100; B.feet = 273; B.on = true; B.face = 1; B.animT = 0; sfx.horn(); }
    camera(dt); updateFoes(dt); return;
  }
  if (areaState === 'saida') {                             // sai da corneta da noite
    B.face = 1; B.vx = 60; moveBlixtoX(B.vx * dt);
    if (B.x >= 1124) { areaState = 'play'; }
    camera(dt); updateFoes(dt); return;
  }
  // final: pega o item → moonwalk → dança → "PARABÉNS"
  if (areaState === 'pegar' || areaState === 'moonwalk' || areaState === 'danca' || areaState === 'fim') {
    B.animT += dt; B.seq += dt;
    if (areaState === 'pegar' && B.seq > 0.6) { areaState = 'moonwalk'; B.seq = 0; B.animT = 0; sfx.item(); }
    else if (areaState === 'moonwalk') {
      // olha para a esquerda e desliza para a direita, no chão plano (sem subir a escada)
      B.face = -1; B.x = Math.min(1540, B.x + 30 * dt); B.feet = GROUND; B.on = true;
      if (B.seq > 3.2) { areaState = 'danca'; B.seq = 0; B.animT = 0; B.face = 1; }
    }
    else if (areaState === 'danca' && B.seq > 4.0) { areaState = 'fim'; B.seq = 0; sfx.win(); }
    camera(dt); return;
  }
  if (areaState !== 'play') { camera(dt); return; }

  // entrada
  const dir = (K.right ? 1 : 0) - (K.left ? 1 : 0);
  B.crouch = K.down && B.on;
  const max = B.crouch ? 0 : (K.run ? 125 : 80);
  const target = dir * max, acc = (B.on ? 900 : 800) * dt;
  B.vx += Math.max(-acc, Math.min(acc, target - B.vx));
  if (dir && dir !== B.face && !B.crouch) { B.face = dir; if (B.on) B.turnT = 0.125; }

  B.coy = B.on ? 0.09 : B.coy - dt;
  B.jb -= dt; B.turnT -= dt; B.landT -= dt; B.inv -= dt;
  if (B.jb > 0 && B.coy > 0) { B.vy = -380; B.jb = 0; B.coy = 0; B.on = false; B.jumped = true; sfx.jump(); }
  if (B.jumped && !K.jump && B.vy < -120) B.vy = -120;
  // gravidade mais pesada na queda: o pulo fica firme, sem flutuar
  B.vy = Math.min(FALL_MAX, B.vy + GRAV * dt * (B.vy > 0 ? 1.15 : 1));

  moveBlixtoX(B.vx * dt);

  // vertical
  const prev = B.feet;
  if (B.on) {
    const under = landBelow(B.x, B.feet);
    if (under === null || under - B.feet > STEP) { B.on = false; B.vy = Math.max(0, B.vy); }
  }
  if (!B.on) {
    const nf = B.feet + B.vy * dt;
    let land = null;
    for (const s of cover(B.x)) if (s[2] >= prev - 0.5 && s[2] <= nf + 0.5 && (land === null || s[2] < land)) land = s[2];
    if (land !== null && B.vy >= 0) {
      B.feet = land; B.vy = 0; B.on = true;
      if (B.jumped) { B.jumped = false; }
      if (B.vy > 0) B.landT = 0.1;
    } else B.feet = nf;
  }
  if (B.on) B.air = 0; else B.air += dt;

  saveCheckpoint();
  if (B.feet > PIT_Y) { hurt('buraco'); return; }

  // raio do transportador: parado no topo, no centro, e então sobe
  if (B.on && B.feet === 237 && B.x >= UFO_X0 && B.x <= UFO_X1) {
    areaState = 'raio'; B.raioT = 0; B.x = 870; sfx.beam(); return;
  }
  // janela: chegou perto e no chão
  if (B.on && B.x >= WINDOW_X) { areaState = 'pegar'; B.seq = 0; B.animT = 0; B.vx = 0; sfx.item(); return; }

  updateFoes(dt);
  camera(dt);
}

function updateFoes(dt) {
  for (const f of foes) {
    f.tt += dt;
    if (f.state === 'andar') {
      const dirv = Math.sign(f.vx);
      // anda pelo topo onde está; vira ao chegar na borda ou numa parede
      const ahead = f.x + dirv * 10;
      const edge = landBelow(ahead, f.feet) === null && stepUp(ahead, f.feet) === null;
      if (edge || wall(ahead, f.feet)) f.vx = -f.vx;
      f.x += f.vx * dt;
      const up = stepUp(f.x, f.feet);
      if (up !== null) f.feet = up;
      const dn = landBelow(f.x, f.feet);
      if (dn !== null && dn - f.feet <= STEP) f.feet = dn;
      if (Math.abs(f.vx) < 1) f.vx = -18;

      // colisão com o Blixto
      if (areaState === 'play' && B.inv <= 0) {
        // a colisão segue o tamanho visível dos dois (Blixto ~ 50 px, escafandro ~ 40 px de largura)
        const overlapX = Math.abs(B.x - f.x) < 19;
        const bTop = B.feet - 44, fTop = f.feet - 36;
        if (overlapX && B.feet > fTop + 10 && B.feet < f.feet + 2) {
          if (B.vy > 0 && B.feet - B.vy * dt <= fTop + 14) {
            f.state = 'impacto'; f.tt = 0; sfx.stomp(); B.vy = K.jump ? -290 : -220; B.jumped = false; B.on = false;
          } else if (bTop < f.feet) {
            hurt('escafandro'); return;
          }
        }
      }
    } else if (f.state === 'impacto') {
      if (f.tt > 0.5) { f.state = 'amassado'; f.tt = 0; }
    }
  }
}

// ---------------------------------------------------------------- desenho
const FAT = 1.22;                      // Blixto mais gordinho (só na largura)
function drawFrame(img, s, cx, feet, flip) {
  const fx = s === SB ? FAT : 1;
  const w = img.width * s * fx, h = img.height * s;
  const x = Math.round(cx - camX - (img.width / 2) * s * fx), y = Math.round(feet - OY - h);
  ctx.save();
  if (flip) { ctx.translate(x + w, 0); ctx.scale(-1, 1); ctx.drawImage(img, 0, y, w, h); }
  else ctx.drawImage(img, x, y, w, h);
  ctx.restore();
}

function blixtoPose() {
  const fps = (n, f) => Math.floor(f * n);
  if (areaState === 'pegar') return G.blixto_item[Math.min(4, Math.floor(B.seq / 0.12))];
  if (areaState === 'moonwalk') return G.blixto_andar[5 - (fps(8, B.animT) % 6)];   // passos de trás
  if (areaState === 'danca' || areaState === 'fim') return G.blixto_danca[fps(8, B.animT) % 8];
  if (areaState === 'raio') return G.blixto_pular[1 + (fps(6, B.raioT) % 2)];
  if (!B.on) {
    if (B.landT > 0) return G.blixto_pular[4];         // pouso
    if (B.vy < -60) return G.blixto_pular[1];          // início / subida
    if (B.vy > 60) return G.blixto_pular[3];           // queda
    return G.blixto_pular[2];                          // ar
  }
  if (B.crouch) return G.blixto_agachar[0];
  if (B.turnT > 0) return G.blixto_virar[0];
  const sp = Math.abs(B.vx);
  if (sp > 95) return G.blixto_correr[fps(10, B.animT) % 6];
  if (sp > 8) return G.blixto_andar[fps(8, B.animT) % 6];
  return G.blixto_parado[fps(2, B.animT) % 2];
}

function drawBlixto() {
  const img = blixtoPose();
  const flip = B.face < 0;
  if (areaState === 'sair' || areaState === 'saida') {
    ctx.save(); ctx.beginPath(); ctx.rect(cutX - camX, 0, VW, VH); ctx.clip();
    drawFrame(img, SB, B.x, B.feet, flip); ctx.restore(); return;
  }
  if (areaState === 'raio') {
    ctx.save(); ctx.globalAlpha = Math.max(0, 1 - Math.max(0, B.raioT - 1.0) / 0.5);
    drawFrame(img, SB, B.x, B.feet, flip); ctx.restore(); return;
  }
  drawFrame(img, SB, B.x, B.feet + B.stepOff, flip);
}

function foeFrame(f) {
  if (f.state === 'andar') return G.escafandro_andar[Math.floor(f.tt * 8) % 6];
  if (f.state === 'impacto') {
    const k = Math.min(3, Math.floor(f.tt * 8));
    return G.escafandro_impacto[k];
  }
  return G.escafandro_amassado[Math.floor(f.tt * 6) % 3];
}

function render() {
  if (!G.cenario) return;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH);
  // cenário: faixa do mapa, rolando com a câmera
  ctx.drawImage(G.cenario, Math.round(camX), 0, VW, VH, 0, 0, VW, VH);
  for (const f of foes) drawFrame(foeFrame(f), SF, f.x, f.feet, false);
  if (!(B.inv > 0 && areaState === 'play' && Math.floor(t * 20) % 2)) drawBlixto();
  if (areaState === 'fim') {                              // "PARABÉNS" em caixa alta, na cor do personagem
    ctx.save();
    ctx.font = 'bold 30px ui-monospace, Menlo, Consolas, monospace';
    ctx.textAlign = 'center'; ctx.lineWidth = 6; ctx.strokeStyle = '#0b0a24';
    ctx.strokeText('PARABÉNS', VW / 2, 56);
    ctx.fillStyle = '#6ff0e0'; ctx.fillText('PARABÉNS', VW / 2, 56);
    ctx.restore();
  }
  if (fade) { ctx.globalAlpha = Math.max(0, Math.min(1, fade.t)); ctx.fillStyle = '#0b0a24'; ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1; }
  crt();
}

// ---------------------------------------------------------------- entrada
const K = { left: false, right: false, down: false, run: false, jump: false };
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowDown: 'down', KeyS: 'down',
  ShiftLeft: 'run', ShiftRight: 'run', KeyX: 'run',
  Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump',
};
function press(k, down) {
  if (down && k === 'jump' && !K.jump) B.jb = 0.12;
  K[k] = down;
}
addEventListener('keydown', e => {
  if (e.code === 'KeyM' && !e.repeat) muted = !muted;
  if (((e.code === 'KeyR' && !e.repeat) || (e.code === 'Enter' && areaState === 'fim')) && areaState !== 'wait' && !fade) {
    e.preventDefault(); areaState = 'wait'; fade = { t: 0, dir: 1, fn: () => startLevel() };
  }
  const k = KEYMAP[e.code];
  if (k) { e.preventDefault(); if (!e.repeat) press(k, true); }
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) press(k, false); });
addEventListener('blur', () => { for (const k in K) K[k] = false; });
for (const b of document.querySelectorAll('#touch button')) {
  const k = b.dataset.k;
  const set = d => e => { e.preventDefault(); press(k, d); b.classList.toggle('down', d); };
  b.addEventListener('pointerdown', set(true));
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, set(false));
}

// ---------------------------------------------------------------- laço
const STEP_T = 1 / 60;
let last = performance.now(), accum = 0, auto = true;
function frame(now) {
  accum += Math.min(0.1, (now - last) / 1000); last = now;
  while (accum >= STEP_T) { if (auto) update(STEP_T); accum -= STEP_T; }
  render();
  requestAnimationFrame(frame);
}

loadAll().then(() => {
  startLevel();
  requestAnimationFrame(frame);
});

// gancho para depuração/testes
window.__blixto = {
  get B() { return B; }, get state() { return areaState; }, get foes() { return foes; }, K, press, SURF,
  set auto(v) { auto = v; }, set muted(v) { muted = v; },
  step(n) { for (let i = 0; i < n; i++) update(STEP_T); render(); },
};
})();
</script>
</body>
